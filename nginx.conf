# RTL-SDR Web UI + OpenWebRX+ reverse proxy
# Serves both apps on the same origin so iframe integration works.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # --- Our preset management app ---

    # Main page
    location = / {
        proxy_pass http://sdr-web:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Our API endpoints
    location /api/ {
        proxy_pass http://sdr-web:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Our static files (CSS, JS, images)
    location /static/ {
        proxy_pass http://sdr-web:8080/static/;
        proxy_set_header Host $host;
    }

    # PWA files
    location = /manifest.json {
        proxy_pass http://sdr-web:8080/manifest.json;
    }
    location = /sw.js {
        proxy_pass http://sdr-web:8080/sw.js;
    }

    # Our status WebSocket (exact match takes priority over /ws/ prefix)
    location = /ws/status {
        proxy_pass http://sdr-web:8080/ws/status;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Our audio WebSocket (standalone fallback)
    location = /ws/audio {
        proxy_pass http://sdr-web:8080/ws/audio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # --- OpenWebRX+ SDR backend ---

    # OpenWebRX+ WebSocket - OpenWebRX+ JS connects to ws://host/ws/
    # This MUST come after the exact /ws/status and /ws/audio matches above
    location /ws/ {
        proxy_pass http://openwebrx:8073/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # OpenWebRX+ served at /sdr/ - iframe target
    # OpenWebRX+ uses relative URLs for assets, so they resolve correctly
    # e.g., page at /sdr/ loads "static/css/openwebrx.css" -> /sdr/static/css/openwebrx.css
    location /sdr/ {
        proxy_pass http://openwebrx:8073/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable gzip from upstream so sub_filter can work
        proxy_set_header Accept-Encoding "";

        # Rewrite absolute paths that OpenWebRX+ JS may construct
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;

        # Fix absolute WebSocket paths in JS (ws://host/ws/ -> ws://host/ws/ is OK since /ws/ is proxied)
        # Fix absolute API/resource paths if OpenWebRX+ uses them
        sub_filter '"/api/'    '"/sdr/api/';
        sub_filter "'/api/"    "'/sdr/api/";
        sub_filter '"/status'  '"/sdr/status';
        sub_filter '"/metrics' '"/sdr/metrics';
        sub_filter '"/login'   '"/sdr/login';
        sub_filter '"/logout'  '"/sdr/logout';
        sub_filter '"/settings' '"/sdr/settings';
        sub_filter '"/imageupload' '"/sdr/imageupload';
    }

    # OpenWebRX+ API (used internally by its frontend via /sdr/api/ rewrite above)
    location /sdr/api/ {
        proxy_pass http://openwebrx:8073/api/;
        proxy_set_header Host $host;
    }
    location /sdr/status {
        proxy_pass http://openwebrx:8073/status;
        proxy_set_header Host $host;
    }
    location /sdr/login {
        proxy_pass http://openwebrx:8073/login;
        proxy_set_header Host $host;
    }
    location /sdr/logout {
        proxy_pass http://openwebrx:8073/logout;
        proxy_set_header Host $host;
    }
    location /sdr/settings/ {
        proxy_pass http://openwebrx:8073/settings/;
        proxy_set_header Host $host;
    }
    location /sdr/metrics {
        proxy_pass http://openwebrx:8073/metrics;
        proxy_set_header Host $host;
    }
}
