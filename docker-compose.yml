version: "3.8"

# Integrated mode: OpenWebRX+ handles all SDR/DSP, our app provides preset management overlay.
# For standalone mode (no OpenWebRX+), use: docker compose -f docker-compose.standalone.yml up
#
# Access the UI at http://localhost:8080
# OpenWebRX+ SDR view is embedded at /sdr/ (same-origin via nginx)

services:
  # OpenWebRX+ - Full SDR backend: DSP, waterfall, spectrum, audio, squelch
  openwebrx:
    image: slechev/openwebrxplus:latest
    container_name: openwebrx
    restart: unless-stopped
    tmpfs:
      - /tmp/openwebrx
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    volumes:
      - openwebrx-settings:/var/lib/openwebrx
    # Not exposed directly - accessed via nginx reverse proxy

  # Our app - Preset management, channel groups, scan, custom overlay UI
  sdr-web:
    build: .
    container_name: sdr-web
    restart: unless-stopped
    volumes:
      - rtlsdr-data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - OPENWEBRX_ENABLED=true
    # Not exposed directly - accessed via nginx reverse proxy

  # Nginx - Reverse proxy, serves both apps on one port (same-origin for iframe)
  nginx:
    image: nginx:alpine
    container_name: sdr-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - openwebrx
      - sdr-web

volumes:
  openwebrx-settings:
  rtlsdr-data:
    driver: local
